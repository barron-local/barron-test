stages:
  - build
  - test
  - push
  - deploy

build-job:
  stage: build
  image: docker:latest
  script:
    - docker build -t app:test .

test-job:
  stage: test
  image: docker:latest
  script:
    - docker run --rm app:test npm test

push-job:
  stage: push
  image: docker:latest
  script:
    - docker tag app:test app:release
    - echo "Artifact packaged and ready for deployment"

deploy-job:
  stage: deploy
  image: docker:latest
  script:
    - docker images | grep app
    - echo "Successfully deployed application container"
  only:
    - main
