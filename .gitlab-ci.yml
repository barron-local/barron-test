workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

stages:
  - build
  - test
  - push
  - deploy

build-job:
  stage: build
  image: docker:latest
  variables:
    DOCKER_BUILDKIT: "0"
  script:
    - docker build --pull=false -t app:test .

test-job:
  stage: test
  image: docker:latest
  script:
    - docker run --rm app:test npm test

push-job:
  stage: push
  image: docker:latest
  script:
    - docker tag app:test app:latest

deploy-job:
  stage: deploy
  image: docker:latest
  script:
    - docker cp ./frontend/. frontend:/app/
    - docker exec -e NEXT_TELEMETRY_DISABLED=1 -i frontend npm run build
    - docker restart frontend
    - docker cp ./index.js app:/app/
    - docker cp ./routes/. app:/app/routes/
    - docker cp ./middlewares/. app:/app/middlewares/
    - docker cp ./config/. app:/app/config/
    - docker cp ./docs/. app:/app/docs/
    - docker restart app
