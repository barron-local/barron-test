workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

stages:
  - build
  - test
  - push
  - deploy

build-job:
  stage: build
  image: docker:latest
  script:
    - docker build -t app:test .

test-job:
  stage: test
  image: docker:latest
  script:
    - docker run --rm app:test npm test

push-job:
  stage: push
  image: docker:latest
  script:
    - docker tag app:test app:release
    - echo "Artifact packaged and ready for deployment"

deploy-job:
  stage: deploy
  image: docker:latest
  script:
    - echo "==> [1/3] Deploying updated application containers to Production..."
    - |
      if docker ps --format '{{.Names}}' | grep -q "^frontend$"; then
        echo "[*] Updating frontend source files into container..."
        docker cp ./frontend/src/. frontend:/app/src/
        [ -f ./frontend/package.json ] && docker cp ./frontend/package.json frontend:/app/package.json 2>/dev/null || true
        echo "[*] Rebuilding Next.js frontend production bundle..."
        docker exec -i frontend npm run build
        echo "[*] Restarting frontend container..."
        docker restart frontend
      fi
    - |
      if docker ps --format '{{.Names}}' | grep -q "^app$"; then
        echo "[*] Updating backend application files..."
        docker cp ./index.js app:/app/index.js 2>/dev/null || true
        docker cp ./routes/. app:/app/routes/ 2>/dev/null || true
        docker cp ./middlewares/. app:/app/middlewares/ 2>/dev/null || true
        docker cp ./config/. app:/app/config/ 2>/dev/null || true
        [ -d ./docs ] && docker cp ./docs/. app:/app/docs/ 2>/dev/null || true
        echo "[*] Restarting backend app container..."
        docker restart app
      fi
    - echo "==> [✓] Production deployment completed successfully! Live websites updated."
  only:
    - main
